# Serves the built React app and forwards /api to the backend container.
#
# Because both arrive on the same origin, the browser never makes a cross-origin
# request: no preflight, no CORS configuration, and nothing to keep in sync when a
# port or host changes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets; the images are already compressed
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A cached service worker is a stuck app — always revalidate this one.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # A browser sends an Origin header on same-origin POST/PUT/PATCH/DELETE too, and
        # Spring's CORS filter would then judge this request against its allow-list and
        # answer 403 "Invalid CORS request" -- even though nginx is serving the app and
        # the API from one origin. Dropping the header says what is actually true: this
        # is not a cross-origin request. Without it the app works on localhost but fails
        # the moment it is reached by LAN IP, tunnel or real domain.
        proxy_set_header Origin "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the API is only slow on a cold start, but leave it room
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA fallback: a refresh on /customers/3 must serve the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
