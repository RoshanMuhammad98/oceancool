# Render Blueprint for the OceanCool API.
#
# In Render: New -> Blueprint -> point it at this repository. Render reads this file and
# creates the service; the values marked `sync: false` are NOT in git and Render will
# prompt for each one on the first deploy.
#
# The blueprint creates the database as well, so deploying is one signup and one click.
# Note Render's free Postgres is DELETED 30 days after creation. When that matters,
# create a free Neon database (permanent) and set DB_URL on the service to its JDBC
# string — that single variable overrides the composed one below, nothing else changes.
#
# The frontend is not here either — it goes to Vercel, which handles SPA routing and a
# global CDN better than a container does. See README section 10.

services:
  - type: web
    name: oceancool-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to Kerala
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # Proves the app is up *and* that it can reach the database, which is what actually
    # goes wrong on a first deploy. Every endpoint is currently open, so no token needed.
    healthCheckPath: /api/dashboard

    envVars:
      # ---- database, wired from the managed instance declared at the bottom ----
      - key: DB_HOST
        fromDatabase:
          name: oceancool-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: oceancool-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: oceancool-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: oceancool-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: oceancool-postgres
          property: password

      # ---- the staff login created on first boot ----
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

      # ---- who may call this API ----
      # Set to the Vercel URL once the frontend is deployed, e.g.
      #   https://oceancool.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # The timezone the business works in — everything called "today" follows it.
      - key: APP_TIMEZONE
        value: Asia/Kolkata

      # Demo customers and services on an empty database — useful while testing,
      # set to false before the shop starts entering real records.
      - key: SEED_DEMO
        value: "true"

      # Neon's free compute suspends when idle, so the first connection after a quiet
      # spell takes a few seconds to wake it. Default Hikari timeout is 30s, which
      # covers it; the small pool respects the free tier's connection limit.
      - key: DB_POOL_SIZE
        value: "5"

databases:
  - name: oceancool-postgres
    plan: free
    region: singapore
    databaseName: oceancool
    user: oceancool
