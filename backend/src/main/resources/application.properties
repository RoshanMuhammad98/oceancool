spring.application.name=oceancool-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# PostgreSQL
# Create the database once:  createdb oceancool
# Every value can be overridden with an environment variable of the same name.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oceancool}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# A serverless Postgres (Neon and friends) suspends its compute when idle, so the first
# connection after a quiet spell has to wait for it to wake. The small pool keeps within
# free-tier connection limits.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT:60000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# Flip to true while working on queries
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JSON
# Dates go over the wire as ISO (yyyy-MM-dd) and are formatted as DD-MM-YYYY in the
# UI. Keeping the wire format ISO means sorting and date inputs stay unambiguous.
# ---------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=Asia/Kolkata

# ---------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------
# The first staff login, created on startup if it does not exist yet.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Demo customers and service records on an empty database. Set to false for the shop.
app.seed-demo=${SEED_DEMO:true}

# Where the React app is served from. Comma-separated, and these are Spring
# *origin patterns*, so the [*] port wildcard covers `npm run dev` (5173),
# `npm run preview` (4173) and whatever port Vite falls back to when one is taken.
# Both spellings of loopback are listed because a browser treats http://localhost and
# http://127.0.0.1 as different origins.
# PRODUCTION MUST OVERRIDE THIS with the exact deployed frontend URL.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# ---------------------------------------------------------------------------
# Errors
# Keep stack traces out of API responses; GlobalExceptionHandler shapes them instead.
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.com.oceancool=INFO
