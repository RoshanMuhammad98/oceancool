# The whole app — database, API and web — with one command. Nothing to install on the
# host but Docker: no Java, no Node, no PostgreSQL password to track down.
#
#   docker compose up --build       ->  http://localhost:3000
#   docker compose down                 stop, keep the data
#   docker compose down -v              stop and wipe the data
#
# Sign in with admin / admin123.
#
# The API is deliberately not published to the host: nginx forwards /api to it inside
# the compose network, so the browser only ever talks to one origin and CORS never
# enters the picture. Poke the API directly through the same port, e.g.
#   curl http://localhost:3000/api/dashboard
# and if you really want it on its own host port, add a `ports:` entry under `api`.
#
# These credentials are for throwaway local containers. Real deployments take theirs
# from the host's environment; see render.yaml and README section 10.

services:
  db:
    image: postgres:17-alpine
    container_name: oceancool-db
    environment:
      POSTGRES_DB: oceancool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    volumes:
      - oceancool-db:/var/lib/postgresql/data
    # the API waits on this rather than racing the database to be ready
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oceancool']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: oceancool-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/oceancool
      DB_USERNAME: postgres
      DB_PASSWORD: localdev
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # Everything the app calls "today" follows this, not the container's UTC clock
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # Demo customers and services on an empty database. Set to false to start blank.
      SEED_DEMO: 'true'
      # Unused while nginx proxies /api — kept for running the Vite dev server against
      # this API instead (see README section 3).
      CORS_ORIGINS: 'http://localhost:[*],http://127.0.0.1:[*]'

  web:
    build: ./frontend
    container_name: oceancool-web
    depends_on:
      - api
    ports:
      # Change the host side if 3000 is taken:  WEB_PORT=3100 docker compose up
      - '${WEB_PORT:-3000}:80'

volumes:
  oceancool-db:
